<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grammatik aktiv B2/C1 - Karteikarten</title>
<style>
  :root{
    --accent1:#ff6b6b; --accent2:#4ecdc4; --accent3:#ffa94d; --accent4:#845ef7;
    --accent5:#20c997; --accent6:#fd7e14; --accent7:#5c7cfa; --accent8:#f06595;
    --accent9:#37b24d; --accent10:#e64980; --accent11:#1c7ed6; --accent12:#f59f00;
    --ink:#1a1a1a; --sub:#767676; --line:#eef0f2; --bg-soft:#f7f8fa;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#ffffff;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);overscroll-behavior:none;}
  #app{min-height:100%;display:flex;flex-direction:column;}
  button{font-family:inherit;}

  /* HOME */
  #home{padding:18px 16px 44px;}
  .home-header{padding:6px 2px 14px;}
  .home-header h1{font-size:21px;margin:0 0 3px;font-weight:800;letter-spacing:-0.2px;}
  .home-header p{margin:0;color:var(--sub);font-size:13.5px;}
  .prog-total{font-size:12.5px;color:#999;margin-top:8px;}
  .prog-bar-outer{height:6px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden;}
  .prog-bar-inner{height:100%;background:linear-gradient(90deg,#20c997,#4ecdc4);border-radius:6px;transition:width .3s ease;}

  .search-wrap{position:relative;margin:14px 0 6px;}
  .search-input{width:100%;padding:12px 40px 12px 14px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--bg-soft);font-size:14.5px;color:var(--ink);outline:none;}
  .search-input:focus{border-color:#4ecdc4;background:#fff;}
  .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;
    font-size:18px;color:#bbb;cursor:pointer;padding:6px;display:none;}
  .search-empty{text-align:center;color:#999;font-size:13.5px;padding:30px 10px;}

  .cat{margin-top:18px;border-radius:16px;overflow:hidden;border:1px solid var(--line);}
  .cat-head{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--bg-soft);cursor:pointer;user-select:none;}
  .cat-arrow{font-size:11px;color:#aaa;transition:transform .2s ease;flex-shrink:0;}
  .cat.open .cat-arrow{transform:rotate(90deg);}
  .cat-title{font-weight:700;font-size:14px;flex:1;}
  .cat-count{font-size:11.5px;color:#999;font-weight:600;flex-shrink:0;}
  .cat-body{display:none;padding:12px;}
  .cat.open .cat-body{display:block;}

  .ring{position:relative;width:32px;height:32px;border-radius:50%;flex-shrink:0;
    background:conic-gradient(var(--rc,#37b24d) calc(var(--pct,0)*1%), #e6e8eb 0);
    display:flex;align-items:center;justify-content:center;}
  .ring::before{content:'';position:absolute;inset:4px;background:#fff;border-radius:50%;}
  .ring-pct{position:relative;font-size:8.5px;font-weight:800;color:var(--rc,#37b24d);}
  .ring.big{width:44px;height:44px;}
  .ring.big::before{inset:5px;}
  .ring.big .ring-pct{font-size:11px;}
  .ring.done{background:none;}
  .ring.done::before{inset:0;background:#37b24d;}
  .ring.done .ring-pct{color:#fff;font-size:14px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .card-tile{border-radius:14px;padding:14px 12px;background:#fff;border:1px solid var(--line);
    box-shadow:0 1px 6px rgba(0,0,0,0.03);position:relative;overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;justify-content:space-between;min-height:112px;
    transition:transform .12s ease, box-shadow .12s ease;}
  .card-tile:active{transform:scale(0.97);}
  .card-tile::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--c,#4ecdc4);}
  .tile-top-row{display:flex;align-items:flex-start;justify-content:space-between;}
  .tile-emoji{font-size:21px;}
  .tile-title{font-weight:700;font-size:13.5px;margin-top:7px;line-height:1.24;}
  .tile-sub{font-size:11px;color:#8a8a8a;margin-top:3px;line-height:1.3;}
  .tile-pill{align-self:flex-start;margin-top:9px;font-size:10.5px;font-weight:700;color:#fff;
    background:var(--c,#4ecdc4);padding:3px 8px;border-radius:20px;}
  mark{background:#fff3bf;border-radius:3px;padding:0 1px;}

  /* STUDY */
  #study{display:none;flex-direction:column;height:100vh;
    background:linear-gradient(180deg,#1c7086 0%,#189a82 42%,#2ab673 78%,#3ec46a 100%);}
  .study-top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.18);}
  .back-btn{border:none;background:rgba(255,255,255,0.22);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;}
  .study-title{font-weight:700;font-size:14.5px;flex:1;line-height:1.25;color:#fff;}
  .study-progress{font-size:12px;color:rgba(255,255,255,0.85);font-weight:600;white-space:nowrap;}
  .fs-btn{border:none;background:rgba(255,255,255,0.22);border-radius:10px;width:36px;height:36px;font-size:17px;
    color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .fs-btn.active{background:#fff;color:var(--c,#4ecdc4);}
  .study-tools{display:flex;gap:8px;padding:8px 16px 0;flex-wrap:wrap;}
  .tool-btn{border:1.5px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.14);border-radius:20px;padding:6px 12px;font-size:12px;
    font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;gap:5px;}
  .tool-btn.active{background:#fff;border-color:#fff;color:var(--c,#189a82);}
  .sec-progbar{height:4px;background:rgba(255,255,255,0.25);margin:10px 16px 0;border-radius:4px;overflow:hidden;}
  .sec-progbar-inner{height:100%;background:#fff;transition:width .25s ease;}

  .card-area{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;perspective:1400px;}
  .flip-card-outer{width:100%;max-width:520px;min-height:280px;position:relative;}
  .flip-card{width:100%;min-height:280px;border-radius:20px;background:#fff;
    border:none;border-top:8px solid var(--c,#4ecdc4);box-shadow:0 12px 32px rgba(0,0,0,0.22);
    padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;cursor:pointer;user-select:none;transition:transform .12s ease;}
  .flip-card.swiping{transition:none;}
  .card-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--c,#4ecdc4);font-weight:800;margin-bottom:14px;}
  .card-text{font-size:19px;line-height:1.5;font-weight:600;}
  .card-hint{margin-top:18px;font-size:12px;color:#bbb;}
  .nav-row{display:flex;gap:12px;padding:12px 16px 24px;}
  .nav-btn{flex:1;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;
    background:rgba(255,255,255,0.22);color:#fff;cursor:pointer;}
  .nav-btn.primary{background:#fff;color:var(--c,#189a82);}
  .nav-btn:disabled{opacity:.4;}

  .done-banner{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#212529;color:#fff;
    padding:10px 18px;border-radius:30px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;
    transition:opacity .25s ease, bottom .25s ease;z-index:20;}
  .done-banner.show{opacity:1;bottom:120px;}

  .custom-badge{position:absolute;top:14px;left:14px;background:#495057;color:#fff;font-size:10.5px;
    font-weight:700;padding:3px 9px;border-radius:20px;}
  .del-btn{position:absolute;bottom:14px;right:14px;border:none;background:#fff0f0;color:#e03131;
    font-size:12px;font-weight:700;padding:6px 12px;border-radius:12px;cursor:pointer;}

  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:50;
    align-items:center;justify-content:center;padding:20px;}
  .modal-backdrop.show{display:flex;}
  .modal-box{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:480px;
    box-shadow:0 10px 40px rgba(0,0,0,0.2);}
  .modal-box h3{margin:0 0 14px;font-size:17px;font-weight:800;}
  .modal-box label{display:block;font-size:12.5px;font-weight:700;color:#666;margin:12px 0 6px;}
  .modal-box textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;
    font-size:14.5px;font-family:inherit;resize:vertical;outline:none;color:var(--ink);}
  .modal-box textarea:focus{border-color:#4ecdc4;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-btn{flex:1;border:none;border-radius:12px;padding:12px;font-size:14.5px;font-weight:700;
    background:#f2f2f2;color:#333;cursor:pointer;}
  .modal-btn.primary{background:#37b24d;color:#fff;}

  /* TABLET / iPAD (>=700px) */
  @media (min-width:700px){
    #home{padding:28px 40px 60px;max-width:1100px;margin:0 auto;}
    .home-header h1{font-size:27px;}
    .home-header p{font-size:15.5px;}
    .grid{grid-template-columns:repeat(3,1fr);gap:14px;}
    .card-tile{min-height:132px;padding:18px 16px;}
    .tile-title{font-size:15px;}
    .tile-sub{font-size:12px;}
    .search-input{font-size:16px;padding:14px 44px 14px 18px;}

    .study-top{padding:18px 28px;}
    .study-title{font-size:17px;}
    .study-tools{padding:10px 28px 0;}
    .tool-btn{font-size:13.5px;padding:8px 16px;}
    .sec-progbar{margin:12px 28px 0;}
    .card-area{padding:36px;}
    .flip-card-outer{max-width:780px;}
    .flip-card{min-height:420px;padding:44px 40px;border-radius:26px;}
    .card-label{font-size:13px;margin-bottom:20px;}
    .card-text{font-size:27px;line-height:1.55;}
    .card-hint{font-size:13.5px;margin-top:26px;}
    .nav-row{padding:16px 28px 34px;max-width:780px;margin:0 auto;}
    .nav-btn{padding:17px;font-size:17px;border-radius:16px;}
  }

  /* LARGE TABLET / DESKTOP (>=1100px) */
  @media (min-width:1100px){
    .grid{grid-template-columns:repeat(4,1fr);}
    .flip-card-outer{max-width:900px;}
    .flip-card{min-height:460px;}
    .card-text{font-size:30px;}
  }

  /* Fullscreen mode: use full viewport height regardless of browser chrome */
  #app:fullscreen, #app:-webkit-full-screen{background:#fff;}
  #app:fullscreen #study, #app:-webkit-full-screen #study{height:100vh;}
</style>
</head>
<body>
<div id="app">

  <div id="home">
    <div class="home-header">
      <h1>Grammatik aktiv B2/C1</h1>
      <p>Üben, Hören, Sprechen &middot; Friederike Jin</p>
      <div class="prog-total" id="progTotal"></div>
      <div class="prog-bar-outer"><div class="prog-bar-inner" id="progBarInner" style="width:0%"></div></div>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="searchInput" placeholder="Ünite, konu veya kelime ara... (z. B. Passiv, Genitiv)" oninput="onSearch()">
      <button class="search-clear" id="searchClear" onclick="clearSearch()">&times;</button>
    </div>
    <div id="catsWrap"></div>
    <div class="search-empty" id="searchEmpty" style="display:none;">Sonuç bulunamadı.</div>
  </div>

  <div id="study">
    <div class="study-top">
      <button class="back-btn" onclick="goHome()">&larr; Geri</button>
      <div class="study-title" id="studyTitle"></div>
      <div class="study-progress" id="studyProgress"></div>
      <button class="fs-btn" id="fsBtn" onclick="toggleFullscreen()" title="Tam ekran">⛶</button>
    </div>
    <div class="study-tools">
      <button class="tool-btn" id="shuffleBtn" onclick="toggleShuffle()">🔀 Karıştır</button>
      <button class="tool-btn" id="unlearnedBtn" onclick="toggleUnlearned()">📌 Sadece öğrenilmemiş</button>
      <button class="tool-btn" id="dirBtn" onclick="cycleDirection()">🇩🇪 Önce Almanca</button>
      <button class="tool-btn" id="addCardBtn" onclick="openAddCardModal()">➕ Cümle ekle</button>
    </div>
    <div class="sec-progbar"><div class="sec-progbar-inner" id="secProgBarInner" style="width:0%"></div></div>
    <div class="card-area">
      <div class="flip-card-outer">
        <div class="flip-card" id="flipCard" onclick="flipCard()">
          <div class="custom-badge" id="customBadge" style="display:none;">Kendi eklediğin</div>
          <div class="card-label" id="cardLabel">DEUTSCH</div>
          <div class="card-text" id="cardText"></div>
          <div class="card-hint" id="cardHint">Kartı çevirmek için dokun veya kaydır</div>
          <button class="del-btn" id="delBtn" style="display:none;" onclick="deleteCurrentCustomCard(event)">🗑️ Sil</button>
        </div>
      </div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" onclick="prevCard()">&larr; Önceki</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextCard()">Sonraki &rarr;</button>
    </div>
  </div>

  <div class="modal-backdrop" id="addCardBackdrop" onclick="closeAddCardModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>Yeni cümle ekle</h3>
      <label>Almanca cümle</label>
      <textarea id="newCardDe" rows="3" placeholder="z. B. Ich habe heute viel gelernt."></textarea>
      <label>Türkçe çevirisi</label>
      <textarea id="newCardTr" rows="3" placeholder="z. B. Bugün çok şey öğrendim."></textarea>
      <div class="modal-actions">
        <button class="modal-btn" onclick="closeAddCardModal()">İptal</button>
        <button class="modal-btn primary" onclick="saveNewCard()">Kaydet</button>
      </div>
    </div>
  </div>

  <div class="done-banner" id="doneBanner">Bu bölümü tamamladın! 🎉</div>

</div>

<script>
const SECTIONS = [
  {
    id: "e1",
    title: "Einheit 1: Verbposition in einfachen Sätzen",
    sub: "Heute möchte ich ins Schwimmbad gehen",
    emoji: "🧩",
    color: "var(--accent1)",
    cards: [
["In diesem Jahr hat Marie keinen richtigen Urlaub gemacht.","Bu yıl Marie gerçek bir tatil yapmadı."],
["Sie konnte noch keinen Urlaub nehmen.","Henüz tatil yapamadı (izin alamadı)."],
["Denn sie hatte gerade erst in der Firma angefangen.","Çünkü şirkette daha yeni başlamıştı."],
["Am liebsten würde sie nächstes Jahr eine Wanderung in den Alpen machen.","En çok isteği, gelecek yıl Alpler'de bir yürüyüş yapmak."],
["Sie geht gerne in den Bergen wandern und klettern.","Dağlarda yürüyüş yapmayı ve tırmanmayı seviyor."],
["Leider macht ihr Freund bei solchen Urlauben nicht mit.","Ne yazık ki erkek arkadaşı böyle tatillere katılmıyor."],
["Wie könnte sie ihren Freund überzeugen?","Erkek arkadaşını nasıl ikna edebilir?"],
["Er findet ihre Urlaubsideen zu anstrengend.","Onun tatil fikirlerini çok yorucu buluyor."],
["Im Kino wird gerade ein Film über die Alpen gezeigt.","Sinemada şu anda Alpler hakkında bir film gösteriliyor."],
["Er hat versprochen: Er wird den Film anschauen.","Söz verdi: Filmi izleyecek."],
["Früher haben sich nur wenige Studierende für ein Auslandssemester beworben.","Eskiden sadece az sayıda öğrenci yurt dışı dönemi için başvuruyordu."],
["Für die meisten jungen Leute waren die bürokratischen und finanziellen Probleme zu groß.","Çoğu genç için bürokratik ve mali sorunlar çok büyüktü."],
["Nach dem Auslandsjahr mussten die Studierenden außerdem oft ein Studienjahr wiederholen.","Ayrıca öğrenciler yurt dışı yılından sonra genellikle bir öğrenim yılını tekrarlamak zorunda kalıyordu."],
["Durch Stipendienprogramme wie Erasmus ist ein Auslandssemester jetzt viel einfacher geworden.","Erasmus gibi burs programları sayesinde yurt dışı dönemi artık çok daha kolay hale geldi."],
["Wenn sie an der ausländischen Uni Prüfungen abgelegt haben, können sich die Studierenden die Leistungsnachweise anerkennen lassen.","Yurt dışındaki üniversitede sınavlara girdilerse, öğrenciler başarı belgelerini tanıtabilirler."],
["Durch ein Auslandssemester verlieren die Studierenden keine Zeit, dadurch dass die meisten Studienleistungen aus dem Ausland auch an der heimischen Universität anerkannt werden.","Yurt dışında alınan derslerin çoğu kendi üniversitelerinde de tanındığı için, öğrenciler yurt dışı dönemiyle zaman kaybetmezler."],
["In meiner Präsentation geht es um Kreativität.","Sunumumda konu yaratıcılık."],
["Kreativität spielt heute in vielen Lebensbereichen eine wichtige Rolle.","Yaratıcılık bugün birçok yaşam alanında önemli bir rol oynuyor."],
["Künstler ebenso wie eine Geschäftsfrau oder Eltern brauchen Kreativität bei ihrer täglichen Arbeit.","Sanatçılar da, bir iş kadını ya da ebeveynler de günlük işlerinde yaratıcılığa ihtiyaç duyar."],
["Beim kreativen Schaffen muss man Dinge aus einer anderen, neuen Perspektive betrachten.","Yaratıcı üretim sırasında olaylara farklı, yeni bir bakış açısından bakmak gerekir."],
["Wie kann man eine solche neue Perspektive finden?","Böyle yeni bir bakış açısı nasıl bulunabilir?"],
["Schon seit vielen Jahren interessiere ich mich für die Bedingungen, unter denen ein Mensch kreativ sein kann.","Yıllardır bir insanın hangi koşullarda yaratıcı olabileceğiyle ilgileniyorum."],
["Kreative Ideen werden manchmal gar nicht auf den ersten Blick erkannt.","Yaratıcı fikirler bazen ilk bakışta hiç fark edilmez."],
["Wenn wir gar nicht daran denken, stellen sich kreative Momente oft ganz überraschend ein.","Onu hiç düşünmediğimizde, yaratıcı anlar genellikle çok beklenmedik şekilde ortaya çıkar."],
["Die besten Dinge fallen mir unter der Dusche oder beim Joggen ein.","En iyi fikirler aklıma duşta ya da koşu yaparken gelir."],

["Wie Sie gewünscht haben, erhalten Sie ein Exemplar unseres gerade erschienenen Produktkataloges.","İstediğiniz gibi, yeni yayımlanan ürün katalogumuzun bir örneğini alıyorsunuz."],
["Haben Sie noch Fragen?","Başka sorunuz var mı?"],
["Oder wünschen Sie weitere Informationen?","Yoksa daha fazla bilgi mi istiyorsunuz?"],
["Bitte wenden Sie sich an Herrn Dieckmann unter der Telefonnummer 04801-731265.","Lütfen 04801-731265 numaralı telefondan Bay Dieckmann'a başvurun."],
["Er berät Sie gerne.","Size memnuniyetle danışmanlık yapar."],
["Da ich im kommenden Monat nach Hamburg umziehe, möchte ich hiermit meinen Vertrag mit dem Clever-Fit-Fitnesscenter kündigen.","Önümüzdeki ay Hamburg'a taşındığım için, Clever-Fit spor salonuyla olan sözleşmemi bu yazıyla feshetmek istiyorum."],
["Bitte buchen Sie ab dem Monat Mai keine Mitgliedsbeiträge mehr von meinem Konto ab.","Lütfen Mayıs ayından itibaren hesabımdan üyelik aidatı çekmeyin."],

["Wenn Sie Fragen haben, schreiben Sie mir bitte an die folgende E-Mail-Adresse.","Sorunuz varsa, lütfen bana aşağıdaki e-posta adresinden yazın."],
["Die modernen Industriestaaten sind seit Jahren flächendeckend mit Hochleistungsnetzen versorgt.","Modern sanayi ülkeleri yıllardır ülke çapında yüksek performanslı şebekelerle donatılmış durumda."],
["Fast alle möchten ihre Handys unterwegs überall nutzen können.","Neredeyse herkes cep telefonlarını her yerde kullanabilmek istiyor."],
["Einige Leute sehen in den dafür nötigen elektromagnetischen Feldern eine Gefahr für die Gesundheit.","Bazı insanlar bunun için gerekli elektromanyetik alanlarda sağlık için bir tehlike görüyor."],
["Sie nehmen an, dass die Dauerbestrahlung in der Nähe von Mobilfunkmasten zu Bluthochdruck und Krebs führt.","Baz istasyonlarının yakınındaki sürekli ışınlanmanın yüksek tansiyona ve kansere yol açtığını varsayıyorlar."],
["Man steht in den Großstädten mehr im Stau als früher.","Büyük şehirlerde eskisinden daha çok trafikte beklenir."],
["Moderne Autos stoßen bei höherer Leistung deutlich weniger Schadstoffe aus als die Autos vor 50 Jahren.","Modern arabalar daha yüksek güçte, 50 yıl önceki arabalara göre belirgin şekilde daha az zararlı madde yayıyor."],
["Die Ernährung in den Industriestaaten ist mit weniger Arbeit verbunden als in den Jahrhunderten zuvor.","Sanayi ülkelerinde beslenme, önceki yüzyıllara göre daha az emekle bağlantılı."],
["Durch die IT-Technik kann man von zu Hause aus genauso gut arbeiten wie im Büro.","Bilgi teknolojisi sayesinde evden de ofisteki kadar iyi çalışılabilir."],
["Die Frage ist, ob die Menschen dieselben geblieben sind wie vor 100 Jahren.","Soru şu: insanlar 100 yıl öncekiyle aynı mı kaldı?"],
["Hätte ich doch einen Porsche!","Keşke bir Porsche'm olsa!"],

function idNum(id){ return parseInt(id.replace('e',''), 10); }
function sectionsForCategory(cat){
  return SECTIONS.filter(s => { const n = idNum(s.id); return n >= cat.range[0] && n <= cat.range[1]; });
}

let currentSection = null;
let currentIndex = 0;
let flipped = false;
let progress = {};
let openCats = {};
let studyOrder = [];
let shuffleOn = false;
let unlearnedOnly = false;
let customCards = {};
let cardDirection = 'de'; // 'de' = önce Almanca, 'tr' = önce Türkçe, 'mixed' = karışık
let currentFrontIsTr = false;

const DIRECTION_LABELS = {
  de: '🇩🇪 Önce Almanca',
  tr: '🇹🇷 Önce Türkçe',
  mixed: '🔀 Karışık yön'
};
function cycleDirection(){
  cardDirection = cardDirection === 'de' ? 'tr' : (cardDirection === 'tr' ? 'mixed' : 'de');
  document.getElementById('dirBtn').textContent = DIRECTION_LABELS[cardDirection];
  document.getElementById('dirBtn').classList.toggle('active', cardDirection !== 'de');
  renderCard();
}

async function loadProgress(){
  try{
    const r = await window.storage.get('gab2c1-progress');
    if(r && r.value) progress = JSON.parse(r.value);
  }catch(e){ progress = {}; }
}
async function saveProgress(){
  try{ await window.storage.set('gab2c1-progress', JSON.stringify(progress)); }catch(e){}
}
async function loadCustomCards(){
  try{
    const r = await window.storage.get('gab2c1-custom-cards');
    if(r && r.value) customCards = JSON.parse(r.value);
  }catch(e){ customCards = {}; }
}
async function saveCustomCards(){
  try{ await window.storage.set('gab2c1-custom-cards', JSON.stringify(customCards)); }catch(e){}
}
function effectiveCards(s){
  const extra = customCards[s.id] || [];
  return s.cards.concat(extra);
}
function effectiveCount(s){
  return s.cards.length + ((customCards[s.id]||[]).length);
}
function markDone(sectionId, idx){
  if(!progress[sectionId]) progress[sectionId] = {};
  if(!progress[sectionId][idx]){
    progress[sectionId][idx] = true;
    saveProgress();
  }
}
function sectionDoneCount(s){
  const p = progress[s.id] || {};
  return Object.keys(p).length;
}
function isCardDone(sectionId, idx){
  return !!(progress[sectionId] && progress[sectionId][idx]);
}

function escapeHtml(str){
  return str.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function highlight(text, q){
  if(!q) return escapeHtml(text);
  const esc = escapeHtml(text);
  const escQ = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return esc.replace(new RegExp('('+escQ+')','ig'), '<mark>$1</mark>');
}

function sectionMatchesQuery(s, q){
  if(!q) return true;
  const hay = (s.title + ' ' + s.sub + ' ' + effectiveCards(s).map(c=>c[0]+' '+c[1]).join(' ')).toLowerCase();
  return hay.includes(q);
}

function renderHome(){
  const wrap = document.getElementById('catsWrap');
  wrap.innerHTML = '';
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  document.getElementById('searchClear').style.display = q ? 'block' : 'none';

  let totalCards=0, totalDone=0;
  SECTIONS.forEach(s=>{ totalCards += effectiveCount(s); totalDone += sectionDoneCount(s); });
  document.getElementById('progTotal').textContent = `Toplam: ${totalDone}/${totalCards} kart tamamlandı · ${SECTIONS.length} bölüm (87 üniteden 87'si hazır — tamamlandı! 🎉)`;
  document.getElementById('progBarInner').style.width = (totalCards? (totalDone/totalCards*100) : 0) + '%';

  let anyMatch = false;

  CATEGORIES.forEach((cat, ci) => {
    const secs = sectionsForCategory(cat).filter(s => sectionMatchesQuery(s, q));
    if(secs.length === 0) return;
    anyMatch = true;

    const catDone = secs.reduce((a,s)=>a+sectionDoneCount(s),0);
    const catTotal = secs.reduce((a,s)=>a+effectiveCount(s),0);
    const catPct = catTotal ? Math.round(catDone/catTotal*100) : 0;
    const isOpen = q ? true : !!openCats[ci];

    const catEl = document.createElement('div');
    catEl.className = 'cat' + (isOpen ? ' open' : '');
    catEl.innerHTML = `
      <div class="cat-head" onclick="toggleCat(${ci})">
        <span class="cat-arrow">&#9656;</span>
        <span style="font-size:16px;">${cat.emoji}</span>
        <span class="cat-title">${cat.name}</span>
        <span class="ring${catPct===100?' done':''}" style="--pct:${catPct};--rc:#37b24d;">
          <span class="ring-pct">${catPct===100?'✓':catPct+'%'}</span>
        </span>
        <span class="cat-count">${catDone}/${catTotal}</span>
      </div>
      <div class="cat-body"><div class="grid" id="grid-${ci}"></div></div>
    `;
    wrap.appendChild(catEl);

    const grid = catEl.querySelector('.grid');
    secs.forEach(s=>{
      const done = sectionDoneCount(s);
      const total = effectiveCount(s);
      const pct = total ? Math.round(done/total*100) : 0;
      const resolvedC = getComputedStyle(document.documentElement).getPropertyValue(s.color.replace('var(','').replace(')','')).trim() || '#4ecdc4';
      const el = document.createElement('div');
      el.className = 'card-tile' + (done === total ? ' done' : '');
      el.style.setProperty('--c', s.color);
      el.onclick = ()=>openSection(s.id);
      el.innerHTML = `
        <div class="tile-top-row">
          <div class="tile-emoji">${s.emoji}</div>
          <span class="ring${pct===100?' done':''}" style="--pct:${pct};--rc:${resolvedC};">
            <span class="ring-pct">${pct===100?'✓':pct+'%'}</span>
          </span>
        </div>
        <div class="tile-title">${highlight(s.title, q)}</div>
        <div class="tile-sub">${highlight(s.sub, q)}</div>
        <div class="tile-pill">${done}/${total} kart</div>
      `;
      grid.appendChild(el);
    });
  });

  document.getElementById('searchEmpty').style.display = (q && !anyMatch) ? 'block' : 'none';
}

function toggleCat(ci){
  openCats[ci] = !openCats[ci];
  renderHome();
}
function onSearch(){ renderHome(); }
function clearSearch(){
  document.getElementById('searchInput').value = '';
  renderHome();
}

function buildStudyOrder(){
  let idxs = effectiveCards(currentSection).map((_,i)=>i);
  if(unlearnedOnly){
    idxs = idxs.filter(i => !isCardDone(currentSection.id, i));
    if(idxs.length === 0) idxs = effectiveCards(currentSection).map((_,i)=>i);
  }
  if(shuffleOn){
    for(let i=idxs.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [idxs[i],idxs[j]] = [idxs[j],idxs[i]];
    }
  }
  studyOrder = idxs;
}

function openSection(id){
  currentSection = SECTIONS.find(s=>s.id===id);
  shuffleOn = false;
  unlearnedOnly = false;
  document.getElementById('shuffleBtn').classList.remove('active');
  document.getElementById('unlearnedBtn').classList.remove('active');
  document.getElementById('dirBtn').textContent = DIRECTION_LABELS[cardDirection];
  document.getElementById('dirBtn').classList.toggle('active', cardDirection !== 'de');
  buildStudyOrder();
  currentIndex = 0;
  flipped = false;
  document.getElementById('home').style.display='none';
  document.getElementById('study').style.display='flex';
  document.getElementById('studyTitle').textContent = currentSection.title;
  document.getElementById('study').style.setProperty('--c', currentSection.color);
  const resolvedColor = getComputedStyle(document.documentElement).getPropertyValue(currentSection.color.replace('var(','').replace(')','')).trim() || '#4ecdc4';
  document.querySelectorAll('.nav-btn.primary').forEach(b=>{ b.style.background = '#fff'; b.style.color = resolvedColor; });
  document.querySelectorAll('.flip-card').forEach(c=>c.style.borderTopColor = resolvedColor);
  document.querySelectorAll('.card-label').forEach(c=>c.style.color = resolvedColor);
  document.querySelectorAll('.tool-btn').forEach(b=>b.style.setProperty('--c', resolvedColor));
  document.querySelectorAll('.fs-btn').forEach(b=>b.style.setProperty('--c', resolvedColor));
  renderCard();
}
function toggleShuffle(){
  shuffleOn = !shuffleOn;
  document.getElementById('shuffleBtn').classList.toggle('active', shuffleOn);
  buildStudyOrder();
  currentIndex = 0;
  renderCard();
}
function toggleUnlearned(){
  unlearnedOnly = !unlearnedOnly;
  document.getElementById('unlearnedBtn').classList.toggle('active', unlearnedOnly);
  buildStudyOrder();
  currentIndex = 0;
  renderCard();
}
function goHome(){
  document.getElementById('study').style.display='none';
  document.getElementById('home').style.display='block';
  renderHome();
}

function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen(){
  const el = document.getElementById('app');
  if(!isFullscreen()){
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}
document.addEventListener('fullscreenchange', updateFsBtn);
document.addEventListener('webkitfullscreenchange', updateFsBtn);
function updateFsBtn(){
  const btn = document.getElementById('fsBtn');
  if(!btn) return;
  btn.classList.toggle('active', isFullscreen());
  btn.textContent = isFullscreen() ? '⛶' : '⛶';
  btn.title = isFullscreen() ? 'Tam ekrandan çık' : 'Tam ekran';
}
function showDoneBanner(){
  const b = document.getElementById('doneBanner');
  b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'), 1800);
}

function openAddCardModal(){
  document.getElementById('newCardDe').value = '';
  document.getElementById('newCardTr').value = '';
  document.getElementById('addCardBackdrop').classList.add('show');
  setTimeout(()=>document.getElementById('newCardDe').focus(), 50);
}
function closeAddCardModal(e){
  if(e) e.preventDefault();
  document.getElementById('addCardBackdrop').classList.remove('show');
}
async function saveNewCard(){
  const de = document.getElementById('newCardDe').value.trim();
  const tr = document.getElementById('newCardTr').value.trim();
  if(!de || !tr){
    alert('Lütfen hem Almanca cümleyi hem de Türkçe çevirisini yazın.');
    return;
  }
  if(!customCards[currentSection.id]) customCards[currentSection.id] = [];
  customCards[currentSection.id].push([de, tr]);
  await saveCustomCards();
  closeAddCardModal();
  buildStudyOrder();
  // Jump to the newly added card (last in the effective list, find its position in studyOrder)
  const newRealIdx = effectiveCards(currentSection).length - 1;
  const pos = studyOrder.indexOf(newRealIdx);
  currentIndex = pos >= 0 ? pos : 0;
  renderCard();
}
function deleteCurrentCustomCard(e){
  if(e) e.stopPropagation();
  const realIdx = studyOrder[currentIndex];
  const builtInCount = currentSection.cards.length;
  if(realIdx < builtInCount) return; // safety: never delete book content
  const customIdx = realIdx - builtInCount;
  if(!confirm('Bu cümleyi silmek istediğine emin misin?')) return;
  customCards[currentSection.id].splice(customIdx, 1);
  saveCustomCards();
  // Clean up progress markers shifted by the deletion
  if(progress[currentSection.id]){
    const p = progress[currentSection.id];
    const newP = {};
    Object.keys(p).forEach(k=>{
      const ki = parseInt(k,10);
      if(ki < realIdx) newP[ki] = true;
      else if(ki > realIdx) newP[ki-1] = true;
    });
    progress[currentSection.id] = newP;
    saveProgress();
  }
  buildStudyOrder();
  if(currentIndex >= studyOrder.length) currentIndex = Math.max(0, studyOrder.length-1);
  renderCard();
}
function renderCard(){
  const realIdx = studyOrder[currentIndex];
  const cards = effectiveCards(currentSection);
  const [de, tr] = cards[realIdx];
  const isCustom = realIdx >= currentSection.cards.length;
  flipped = false;
  currentFrontIsTr = cardDirection === 'tr' ? true : (cardDirection === 'mixed' ? Math.random() < 0.5 : false);
  document.getElementById('cardLabel').textContent = currentFrontIsTr ? 'TÜRKÇE' : 'DEUTSCH';
  document.getElementById('cardText').textContent = currentFrontIsTr ? tr : de;
  document.getElementById('cardHint').textContent = 'Kartı çevirmek için dokun veya kaydır';
  document.getElementById('studyProgress').textContent = `${currentIndex+1}/${studyOrder.length}`;
  document.getElementById('customBadge').style.display = isCustom ? 'block' : 'none';
  document.getElementById('delBtn').style.display = isCustom ? 'block' : 'none';
  const done = sectionDoneCount(currentSection);
  const total = effectiveCount(currentSection);
  document.getElementById('secProgBarInner').style.width = (total? (done/total*100):0) + '%';
  const card = document.getElementById('flipCard');
  card.style.transform = '';
}
function flipCard(){
  const realIdx = studyOrder[currentIndex];
  const cards = effectiveCards(currentSection);
  const [de, tr] = cards[realIdx];
  flipped = !flipped;
  const wasDone = isCardDone(currentSection.id, realIdx);
  const backIsTr = !currentFrontIsTr;
  if(flipped){
    document.getElementById('cardLabel').textContent = backIsTr ? 'TÜRKÇE' : 'DEUTSCH';
    document.getElementById('cardText').textContent = backIsTr ? tr : de;
    markDone(currentSection.id, realIdx);
    if(!wasDone){
      const done = sectionDoneCount(currentSection);
      const total = effectiveCount(currentSection);
      document.getElementById('secProgBarInner').style.width = (total? (done/total*100):0) + '%';
      if(done === total) showDoneBanner();
    }
  } else {
    document.getElementById('cardLabel').textContent = currentFrontIsTr ? 'TÜRKÇE' : 'DEUTSCH';
    document.getElementById('cardText').textContent = currentFrontIsTr ? tr : de;
  }
}
function nextCard(){
  currentIndex = (currentIndex + 1) % studyOrder.length;
  renderCard();
}
function prevCard(){
  currentIndex = (currentIndex - 1 + studyOrder.length) % studyOrder.length;
  renderCard();
}

// Keyboard navigation
document.addEventListener('keydown', (e)=>{
  if(document.getElementById('study').style.display !== 'flex') return;
  if(e.key === 'ArrowRight') nextCard();
  else if(e.key === 'ArrowLeft') prevCard();
  else if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flipCard(); }
});

// Swipe navigation
(function(){
  let startX = 0, startY = 0, dragging = false;
  const area = document.getElementById('app');
  area.addEventListener('touchstart', (e)=>{
    if(document.getElementById('study').style.display !== 'flex') return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; dragging = true;
    document.getElementById('flipCard').classList.add('swiping');
  }, {passive:true});
  area.addEventListener('touchmove', (e)=>{
    if(!dragging) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    document.getElementById('flipCard').style.transform = `translateX(${dx}px) rotate(${dx/30}deg)`;
  }, {passive:true});
  area.addEventListener('touchend', (e)=>{
    if(!dragging) return;
    dragging = false;
    const card = document.getElementById('flipCard');
    card.classList.remove('swiping');
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)){
      card.style.transition = 'transform .2s ease';
      card.style.transform = `translateX(${dx>0?600:-600}px) rotate(${dx>0?25:-25}deg)`;
      setTimeout(()=>{
        card.style.transition = '';
        if(dx > 0) prevCard(); else nextCard();
      }, 160);
    } else {
      card.style.transform = '';
    }
  });
})();

(async function init(){
  await loadProgress();
  await loadCustomCards();
  renderHome();
})();
</script>
</body>
